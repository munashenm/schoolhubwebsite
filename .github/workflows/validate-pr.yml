name: Validate SchoolHub marketing site

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The existing marketing Header.tsx has a pre-existing React hooks lint issue.
      # Keep this PR narrowly scoped; lint all new/modified privacy files.
      - name: Lint privacy changes
        run: |
          npx eslint src/app/application-privacy/page.tsx src/app/data-deletion/page.tsx \
            src/app/privacy/page.tsx src/components/privacy/DeletionForms.tsx \
            src/lib/application-privacy.ts src/lib/navigation.ts src/lib/pages.ts
      - name: Verify static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://schoolhubsa.co.za
      - name: Confirm legal routes exported
        run: |
          test -f out/application-privacy/index.html
          test -f out/data-deletion/index.html
